name: net-promoter-classifier
version: 1.0.0
description: "Classifies survey responses into standard NPS categories (Promoter, Passive, Detractor)"
input_schema:
  type: object
  properties:
    nps_score_json:
      type: string
      description: "JSON with nps_score integer from 0 to 10"
  required:
    - nps_score_json
implementation:
  type: script
  path: net_promoter_classifier.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
