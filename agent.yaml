spec_version: "0.1.0"
name: git-churnprevent
version: 1.0.0
description: "Autonomous SaaS Customer Retention, Usage Velocity Scoring & Playbook Intervention Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - saas-churn-modeling
  - retention-intervention-tactics

tools:
  - usage-velocity-scorer
  - net-promoter-classifier
  - retention-playbook-selector

runtime:
  max_turns: 50
  timeout: 120

tags:
  - marketing-sales
  - churn-prevention
  - customer-success
  - saas-retention
  - passport-challenge

metadata:
  passport_id: "aps-churnprevent-01"
  passport_category: "Marketing & sales"
